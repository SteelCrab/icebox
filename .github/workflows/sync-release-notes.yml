# Sync release notes from CHANGELOG.md
#
# When CHANGELOG.md is updated on main (e.g., via PR merge), this workflow
# keeps existing GitHub Releases' bodies in sync with the matching
# `## vX.Y.Z` section.
#
# Tag creation is intentionally NOT automated — push a tag manually
# (`git tag -a vX.Y.Z && git push origin vX.Y.Z`) to trigger release.yml.
#
# Idempotent: no-op if every release body is already in sync.

name: Sync release notes

on:
  push:
    branches: [main]
    paths:
      - CHANGELOG.md
      - .github/workflows/sync-release-notes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Sync CHANGELOG → release bodies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0      # Need full history to check tags

      - name: Update release bodies for existing releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          updated=0
          skipped=0
          missing=0

          while IFS= read -r TAG; do
            NOTES=$(awk "/^## ${TAG//./\\.}\$/{found=1; next} /^## v[0-9]/{if(found) exit} found" CHANGELOG.md)
            if [ -z "$NOTES" ]; then
              skipped=$((skipped+1))
              continue
            fi

            # Skip releases that don't exist yet — they are created by
            # release.yml once the tag is pushed manually.
            if ! gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
              echo "skip $TAG — release not yet created (push the tag to trigger release.yml)"
              missing=$((missing+1))
              continue
            fi

            # Skip if body already in sync
            CURRENT=$(gh release view "$TAG" -R "$REPO" --json body -q .body)
            if [ "$CURRENT" = "$NOTES" ]; then
              skipped=$((skipped+1))
              continue
            fi

            echo "$NOTES" > /tmp/notes-$TAG.md
            gh release edit "$TAG" -R "$REPO" --notes-file /tmp/notes-$TAG.md
            echo "updated $TAG"
            updated=$((updated+1))
          done < <(grep -E '^## v[0-9]' CHANGELOG.md | sed 's/^## //')

          echo "Summary: $updated updated, $skipped unchanged, $missing deferred to release.yml"
